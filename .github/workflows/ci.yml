# Build and run the test suites on every push and pull request (docs/macos.md,
# milestone 1). Linux builds everything, the app included; macOS builds the
# libraries, the tests and the app's MIDI modes (milestone 3). The suites use
# fakes: no audio, MIDI or display needed.
#
# external/uw-core and external/dpf (the DPF fork, with the pugl fork inside
# it) are private repos, which the workflow's own token can't read: the
# SUBMODULES_TOKEN secret (a token with read access to uw-core, DPF and pugl)
# is used when set.
name: CI

on:
  push:
    branches: [main, rack-view]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04   # alsa-lib 1.2.11 (1.2.10+ needed)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          # One package list for every Unlikelyware project, as in BUILDING.md
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 git \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcb1-dev libx11-xcb-dev libxcb-util-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libasound2-dev libjack-jackd2-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libdecor-0-dev libudev-dev \
            libdbus-1-dev libibus-1.0-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    # Apple Silicon, macOS 26 (the oldest StageHand supports), with its default Xcode
    # (26): compiling the app icon (an Icon Composer document) needs Xcode 26 running on
    # macOS 26. On macOS 15, Xcode 16's actool writes nothing, and Xcode 26's crashes.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Install build dependencies
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
