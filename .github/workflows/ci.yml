# Build and run the test suites on every push and pull request (docs/macos.md,
# milestone 1). Linux builds everything, the app included; macOS builds the
# libraries, the tests and the app's MIDI modes (milestone 3). The suites use
# fakes: no audio, MIDI or display needed.
#
# external/uw-core and external/dpf (the DPF fork, with the pugl fork inside
# it) are private repos, which the workflow's own token can't read: the
# SUBMODULES_TOKEN secret (a token with read access to uw-core, DPF and pugl)
# is used when set.
name: CI

on:
  push:
    branches: [main, rack-view]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04   # alsa-lib 1.2.11 (1.2.10+ needed)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libjack-jackd2-dev libasound2-dev \
            libx11-dev libxrandr-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-15   # Apple Silicon, macOS 15 (the oldest StageHand supports)
    env:
      # The image's default Xcode is 16.4, which can't compile the app icon (an Icon
      # Composer document, new in Xcode 26): use the image's 26.3, as on the Mac.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - name: Install build dependencies
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
